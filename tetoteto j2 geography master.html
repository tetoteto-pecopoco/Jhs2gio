<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12645f"><title>てとてと｜中2地理マスター</title><style>
:root{--bg:#f5f8f7;--w:#fff;--ink:#203532;--sub:#5c7771;--p:#14675d;--bd:#dce7e2;--lt:#e5f2ed;--ok:#eaf8ee;--ng:#fdf0f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101a18;--w:#182623;--ink:#e6f0ed;--sub:#9db5ae;--p:#5cc2b0;--bd:#2c423d;--lt:#21352f;--ok:#17352a;--ng:#3a2222}}
*{box-sizing:border-box}html{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif}body{margin:0;background:var(--bg);color:var(--ink)}button{font:inherit;color:inherit;cursor:pointer}
main{width:min(690px,100%);margin:auto;padding:18px 16px 60px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;margin-bottom:18px}.logo{width:38px;height:38px;border-radius:13px;background:var(--p);color:#fff;display:grid;place-items:center}
.hero{background:linear-gradient(138deg,#115c54,#258378);color:#fff;padding:26px 22px;border-radius:24px}.hero h1{font-size:clamp(25px,7vw,34px);margin:8px 0;line-height:1.4}.hero p{margin:0;font-size:14px;line-height:1.8;color:#e7f7f1}
h2{font-size:17px;margin:22px 0 12px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tile{background:var(--w);border:1.5px solid var(--bd);border-radius:17px;padding:15px;text-align:left;min-height:96px}.tile:disabled{opacity:.5}.tile span{font-size:11px;font-weight:800;color:var(--p);background:var(--lt);padding:4px 9px;border-radius:20px}.tile strong{display:block;margin:9px 0 3px;font-size:16px}.tile small{font-size:12px;color:var(--sub)}.wide{grid-column:span 2}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.stat{background:var(--w);border:1px solid var(--bd);border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:22px;color:var(--p)}.stat span{font-size:11px;color:var(--sub)}.note{font-size:12px;line-height:1.8;color:var(--sub);margin-top:16px}
.top{display:flex;justify-content:space-between;align-items:center}.back{background:none;border:0;color:var(--p);font-weight:800;padding:10px 4px}.pill{background:var(--lt);color:var(--p);font-size:12px;font-weight:750;padding:7px 10px;border-radius:99px}.track{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0 18px}.bar{height:100%;background:var(--p);transition:width .3s}
.card{background:var(--w);border:1px solid var(--bd);border-radius:22px;padding:22px 18px}.qh{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;font-size:12px;font-weight:800;color:var(--sub)}.q{font-size:18px;line-height:1.8;font-weight:700;margin:16px 0 18px;padding:16px;background:var(--bg);border-radius:14px}
.opts{display:grid;gap:10px}.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;text-align:left;padding:10px 14px;border:1.5px solid var(--bd);border-radius:15px;background:var(--w);font-weight:700;font-size:16px;line-height:1.5}.opt:not(:disabled):hover{border-color:var(--p)}.l{flex:0 0 32px;height:32px;border-radius:10px;background:var(--lt);color:var(--p);display:grid;place-items:center;font-weight:850}.opt.c{background:var(--ok);border-color:#43a173}.opt.x{background:var(--ng);border-color:#ca7373}.opt.d{opacity:.55}
.fb{margin-top:16px;padding:15px;border-radius:15px;background:var(--ok);line-height:1.8;font-size:14px}.fb.bad{background:var(--ng)}.fb strong{display:block;font-size:17px}.btn,.sub{display:block;width:100%;min-height:52px;margin-top:14px;border-radius:13px;font-weight:850;border:0}.btn{background:var(--p);color:#fff}.sub{background:none;border:1.5px solid var(--p);color:var(--p);margin-top:9px}
.res{text-align:center;background:var(--w);border:1px solid var(--bd);border-radius:22px;padding:24px 18px}.pct{font-size:58px;font-weight:900;color:var(--p)}.wl{text-align:left;background:var(--bg);border-radius:14px;padding:12px;margin:18px 0;font-size:14px}.wl div{padding:8px 0;border-bottom:1px solid var(--bd)}.wl div:last-child{border:0}.wl span{display:block;color:var(--sub);font-size:12px}
@media(min-width:650px){.modes{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main id="r"></main><script>
const D=[{"id":"J2G172","lv":"日本｜地形と海流","src":"追加資料","q":"地震の震源や火山が帯状に分布し、大地の動きが活発な地域の総称は？","a":"変動帯","o":["変動帯","安定陸塊","大陸棚","堆積平野"],"e":"日本列島も変動帯にあり、地震や火山活動が活発である。","field":"地理"},{"id":"J2G173","lv":"日本｜地形と海流","src":"追加資料","q":"日本列島を含み、太平洋を取り囲むように連なる造山帯は？","a":"環太平洋造山帯","o":["環太平洋造山帯","アルプス・ヒマラヤ造山帯","大西洋中央海嶺","東アフリカ大地溝帯"],"e":"太平洋の周辺には地震や火山活動が活発な地域が連なる。","field":"地理"},{"id":"J2G174","lv":"日本｜地形と海流","src":"追加資料","q":"ユーラシア大陸南部から地中海周辺にかけて連なる造山帯は？","a":"アルプス・ヒマラヤ造山帯","o":["アルプス・ヒマラヤ造山帯","環太平洋造山帯","大西洋中央海嶺","東アフリカ大地溝帯"],"e":"ユーラシア大陸の南部を中心に連なる造山帯である。","field":"地理"},{"id":"J2G175","lv":"日本｜地形と海流","src":"追加資料","q":"日本の陸地で、山がちな土地が占める割合はおよそどれくらい？","a":"4分の3","o":["4分の3","4分の1","2分の1","10分の1"],"e":"日本は山がちな国で、平野などに人口や産業が集中しやすい。","field":"地理"},{"id":"J2G176","lv":"日本｜地形と海流","src":"追加資料","q":"日本の川を大陸の大河と比べたときの特徴は？","a":"距離が短く、流れが急","o":["距離が短く、流れが急","距離が長く、流れが緩やか","距離が短く、流れが緩やか","距離が長く、流れが急"],"e":"山地から海までの距離が短く、高低差が大きいため急流が多い。","field":"地理"},{"id":"J2G177","lv":"日本｜地形と海流","src":"追加資料","q":"一つの川とその支流に雨水などが集まる土地の範囲は？","a":"流域","o":["流域","河口","分水界","海溝"],"e":"流域の広さを流域面積といい、日本の川は大陸の大河より流域面積が小さい。","field":"地理"},{"id":"J2G178","lv":"日本｜地形と海流","src":"追加資料","q":"山から運ばれた土砂が、河口付近に積もってできる低く平らな地形は？","a":"三角州","o":["三角州","扇状地","台地","砂丘"],"e":"三角州は水田や市街地などに利用される。扇状地は山地の出口にできる。","field":"地理"},{"id":"J2G179","lv":"日本｜地形と海流","src":"追加資料","q":"川が運んできた土砂を、流れが緩やかになった場所に積もらせる働きは？","a":"堆積作用","o":["堆積作用","侵食作用","風化作用","火山活動"],"e":"川には、土地を削る侵食、土砂を運ぶ運搬、土砂を積もらせる堆積の働きがある。","field":"地理"},{"id":"J2G180","lv":"日本｜地形と海流","src":"追加資料","q":"周りを山地に囲まれた平らな土地は？","a":"盆地","o":["盆地","海岸平野","大陸棚","砂州"],"e":"内陸部の山地に囲まれた平地が盆地である。","field":"地理"},{"id":"J2G181","lv":"日本｜地形と海流","src":"追加資料","q":"周囲の低地より一段高く、上面が平らな地形は？","a":"台地","o":["台地","三角州","干潟","海溝"],"e":"台地は周りの低地より高く、畑や住宅地などに利用される。","field":"地理"},{"id":"J2G182","lv":"日本｜地形と海流","src":"追加資料","q":"標高が高く、起伏が比較的小さい土地は？","a":"高原","o":["高原","低地","砂浜","三角州"],"e":"高原は標高の高い平たんな土地。中央高地では高原野菜の栽培などに利用される。","field":"地理"},{"id":"J2G183","lv":"日本｜地形と海流","src":"追加資料","q":"比較的標高が低く、なだらかな起伏が続く地形は？","a":"丘陵","o":["丘陵","高山","海溝","大陸棚"],"e":"丘陵は山地より低く、なだらかな起伏のある土地である。","field":"地理"},{"id":"J2G184","lv":"日本｜地形と海流","src":"追加資料","q":"風によって運ばれた砂が積もってできる丘は？","a":"砂丘","o":["砂丘","扇状地","三角州","カルデラ"],"e":"鳥取砂丘などが例である。川がつくる扇状地や三角州と区別しよう。","field":"地理"},{"id":"J2G185","lv":"日本｜地形と海流","src":"追加資料","q":"砂が広がる海岸の呼び名は？","a":"砂浜海岸","o":["砂浜海岸","岩石海岸","リアス海岸","サンゴ礁の海岸"],"e":"砂浜海岸には、風で砂が積もった砂丘が発達することがある。","field":"地理"},{"id":"J2G186","lv":"日本｜地形と海流","src":"追加資料","q":"岩場が続く海岸の呼び名は？","a":"岩石海岸","o":["岩石海岸","砂浜海岸","サンゴ礁の海岸","干拓地"],"e":"海岸は砂浜海岸・岩石海岸・リアス海岸などに分けられる。","field":"地理"},{"id":"J2G187","lv":"日本｜地形と海流","src":"追加資料","q":"陸地の周辺に広がる、水深約200mまでの緩やかな海底地形は？","a":"大陸棚","o":["大陸棚","海溝","海嶺","深海平原"],"e":"大陸棚は比較的浅く、漁場としても利用される。","field":"地理"},{"id":"J2G188","lv":"日本｜地形と海流","src":"追加資料","q":"プレートが沈み込む場所などにできる、深い溝状の海底地形は？","a":"海溝","o":["海溝","大陸棚","砂州","干潟"],"e":"日本の太平洋側には、日本海溝などの深い海溝が連なる。","field":"地理"},{"id":"J2G189","lv":"日本｜地形と海流","src":"追加資料","q":"本州中央部にあり、ラテン語で「大きな溝」を意味する地質上の地域は？","a":"フォッサマグナ","o":["フォッサマグナ","カルデラ","リアス海岸","大陸棚"],"e":"フォッサマグナは本州中央部にある地質構造上の大きな溝状の地域である。","field":"地理"},{"id":"J2G190","lv":"日本｜地形と海流","src":"追加資料","q":"太平洋側を北から南へ流れる、千島海流とも呼ばれる寒流は？","a":"親潮","o":["親潮","黒潮","対馬海流","リマン海流"],"e":"親潮＝千島海流、黒潮＝日本海流。黒潮と日本海流は同じ海流の別名である。","field":"地理"},{"id":"J2G191","lv":"日本｜地形と海流","src":"追加資料","q":"暖流と寒流が出合い、よい漁場になりやすい海域は？","a":"潮境（潮目）","o":["潮境（潮目）","海溝","大陸棚","干拓地"],"e":"日本の東の太平洋沖では黒潮と親潮が出合う。","field":"地理"},{"id":"J2G192","lv":"日本｜地形と海流","src":"追加資料","q":"太平洋側を南から北へ流れる暖流の、漢字4文字の別名は？","a":"日本海流","o":["日本海流","千島海流","リマン海流","対馬海流"],"e":"黒潮は日本の太平洋側を流れる暖流である。","field":"地理"},{"id":"J2G193","lv":"日本｜地形と海流","src":"追加資料","q":"日本海の大陸側を南下する寒流は？","a":"リマン海流","o":["リマン海流","対馬海流","黒潮","親潮"],"e":"日本海には暖流の対馬海流と、寒流のリマン海流がある。","field":"地理"},{"id":"J2G194","lv":"日本｜地形と海流","src":"追加資料","q":"川が山地から出た所に土砂が扇形に積もった土地で、果樹栽培が盛んな理由は？","a":"砂礫が多く、水はけがよいため","o":["砂礫が多く、水はけがよいため","細かい粘土が多く、水をためやすいため","地下水位が高く、根が水につかりやすいため","潮の満ち引きで土壌に養分が運ばれるため"],"e":"扇状地は一般に砂や礫が多く、水はけのよさを生かして果樹を育てる。","field":"地理"},{"id":"J2G195","lv":"日本｜地形と海流","src":"追加資料","q":"岩石が気温の変化や水などの影響で、長い年月をかけてくずれやすくなる働きは？","a":"風化","o":["風化","堆積","隆起","噴火"],"e":"風化で岩石がくずれ、侵食などとあわせて長い年月で地形が変化する。","field":"地理"},{"id":"J2G196","lv":"日本｜主な山地・平野・河川","src":"追加資料","q":"東北地方の中央部を南北に連なる山脈は？","a":"奥羽山脈","o":["奥羽山脈","飛騨山脈","木曽山脈","赤石山脈"],"e":"奥羽山脈は東北地方の中央部に連なり、日本海側と太平洋側の気候の違いにも関わる。","field":"地理"},{"id":"J2G197","lv":"日本｜主な山地・平野・河川","src":"追加資料","q":"北アメリカ大陸西部に連なり、環太平洋の造山帯に含まれる山脈は？","a":"ロッキー山脈","o":["ロッキー山脈","アンデス山脈","アルプス山脈","ヒマラヤ山脈"],"e":"ロッキー山脈は北アメリカ、アンデス山脈は南アメリカの西部にある。","field":"地理"},{"id":"J2G198","lv":"日本｜主な山地・平野・河川","src":"追加資料","q":"南アメリカ大陸の西部を南北に連なる山脈は？","a":"アンデス山脈","o":["アンデス山脈","ロッキー山脈","アルプス山脈","ヒマラヤ山脈"],"e":"アンデス山脈は太平洋側に沿って連なる。","field":"地理"},{"id":"J2G199","lv":"日本｜主な山地・平野・河川","src":"追加資料","q":"インドの北にあり、世界最高峰を含む山脈は？","a":"ヒマラヤ山脈","o":["ヒマラヤ山脈","アルプス山脈","ロッキー山脈","アンデス山脈"],"e":"ヒマラヤ山脈はユーラシア大陸南部に連なる。","field":"地理"},{"id":"J2G200","lv":"日本｜主な山地・平野・河川","src":"追加資料","q":"ヨーロッパの中央部から南部にかけて連なる山脈は？","a":"アルプス山脈","o":["アルプス山脈","ヒマラヤ山脈","ロッキー山脈","アンデス山脈"],"e":"日本アルプスの呼び名は、ヨーロッパのアルプス山脈になぞらえたもの。","field":"地理"},{"id":"J2G201","lv":"日本｜主な山地・平野・河川","src":"追加資料","q":"北海道東部に広がり、酪農が盛んな台地は？","a":"根釧台地","o":["根釧台地","牧ノ原台地","シラス台地","武蔵野台地"],"e":"根釧台地は北海道東部にある。冷涼な気候のもとで酪農が盛ん。","field":"地理"},{"id":"J2G202","lv":"日本｜主な山地・平野・河川","src":"追加資料","q":"北海道中央部から南へ連なる山脈は？","a":"日高山脈","o":["日高山脈","奥羽山脈","木曽山脈","赤石山脈"],"e":"日高山脈は北海道にある山脈である。","field":"地理"},{"id":"J2G203","lv":"日本｜主な山地・平野・河川","src":"追加資料","q":"北海道西部の石狩川下流に広がる平野は？","a":"石狩平野","o":["石狩平野","十勝平野","仙台平野","関東平野"],"e":"石狩川と石狩平野を組にして覚えよう。","field":"地理"},{"id":"J2G204","lv":"日本｜主な山地・平野・河川","src":"追加資料","q":"北海道東部にあり、十勝川が流れる平野は？","a":"十勝平野","o":["十勝平野","石狩平野","庄内平野","越後平野"],"e":"十勝平野は北海道東部に広がり、大規模な農業が行われる。","field":"地理"},{"id":"J2G205","lv":"日本｜主な山地・平野・河川","src":"追加資料","q":"主に岩手県の東部に広がる、なだらかな高地は？","a":"北上高地","o":["北上高地","中央高地","阿武隈高地","根釧台地"],"e":"北上高地は主に岩手県に広がる。","field":"地理"},{"id":"J2G206","lv":"日本｜主な山地・平野・河川","src":"追加資料","q":"東北地方の日本海側にあり、最上川の河口付近に広がる平野は？","a ,{"id":"J2G293","lv":"日本｜産業の特色","src":"追加資料","q":"関東南部から北部九州へ、工業地帯や工業地域が帯状に続く地域は？","a":"太平洋ベルト","o":["太平洋ベルト","三大都市圏","中央高地","日本海側工業帯"],"e":"臨海部の港や交通網などを利用して、大規模な工業が集まっている。","field":"地理"},{"id":"J2G294","lv":"日本｜産業の特色","src":"追加資料","q":"東京・横浜などを中心に広がる工業地帯は？","a":"京浜工業地帯","o":["京浜工業地帯","中京工業地帯","阪神工業地帯","北九州工業地域"],"e":"京浜は東京・横浜、中京は名古屋、阪神は大阪・神戸などが中心。","field":"地理"},{"id":"J2G295","lv":"日本｜産業の特色","src":"追加資料","q":"生産拠点の海外移転などによって、国内の産業がおとろえる現象は？","a":"産業の空洞化","o":["産業の空洞化","都市の過密化","人口の高齢化","農業の集約化"],"e":"海外移転の背景には、生産費用などの違いがある。","field":"地理"},{"id":"J2G296","lv":"日本｜産業の特色","src":"追加資料","q":"大規模な工場が臨海部に立地する主な利点は？","a":"原材料の輸入や製品の輸送に船を利用しやすい","o":["原材料の輸入や製品の輸送に船を利用しやすい","高原の涼しい気温を利用して製品を保管しやすい","山地の鉱山と工場を近接させて原料を調達しやすい","山間部の豊富な水と大きな落差を利用しやすい"],"e":"港を利用し、原材料や製品を大量に輸送できる。","field":"地理"},{"id":"J2G297","lv":"日本｜産業の特色","src":"追加資料","q":"内陸部の高速道路沿いに工場を建てる利点は？","a":"部品や製品をトラックで運びやすい","o":["部品や製品をトラックで運びやすい","港の大型岸壁で原材料を荷揚げしやすい","鉱山から採掘した原料を短い距離で運べる","河川の落差を利用して発電しやすい"],"e":"高速道路は、工場と取引先や市場を結ぶ輸送に役立つ。","field":"地理"},{"id":"J2G298","lv":"日本｜交通と情報通信","src":"追加資料","q":"戸口から戸口までの配送に便利な、代表的な貨物輸送手段は？","a":"トラック","o":["トラック","鉄道","船舶","航空機"],"e":"トラックは道路を利用し、集荷先や届け先の近くまで荷物を運べる。","field":"地理"},{"id":"J2G299","lv":"日本｜交通と情報通信","src":"追加資料","q":"石油・石炭・鉄鉱石など、重くてかさばる物を大量に運ぶのに適した輸送手段は？","a":"船舶","o":["船舶","航空機","宅配用自転車","旅客専用の新幹線"],"e":"船は一度に大量の貨物を運べ、資源の国際輸送にも利用される。","field":"地理"},{"id":"J2G300","lv":"日本｜交通と情報通信","src":"追加資料","q":"軽量で高価な製品や、鮮度が大切な品物を遠くへ急いで運ぶのに適した手段は？","a":"航空機","o":["航空機","大型貨物船","徒歩","自転車"],"e":"航空輸送は速いが、運賃が高く、大量で重い貨物の輸送には向きにくい。","field":"地理"},{"id":"J2G301","lv":"日本｜交通と情報通信","src":"追加資料","q":"時刻どおりに運行しやすく、大量輸送にも適した陸上の交通機関は？","a":"鉄道","o":["鉄道","航空機","船舶","自転車"],"e":"鉄道は定時性に優れ、大量輸送の際には環境負荷を抑えやすい。","field":"地理"},{"id":"J2G302","lv":"日本｜交通と情報通信","src":"追加資料","q":"東京・大阪間の移動時間を大きく短縮し、1964年に開業した高速旅客路線は？","a":"東海道新幹線","o":["東海道新幹線","山陽新幹線","東北新幹線","九州新幹線"],"e":"東海道新幹線は1964年に東京・新大阪間で開業した。","field":"地理"},{"id":"J2G303","lv":"日本｜交通と情報通信","src":"追加資料","q":"高速道路と新幹線などが全国に広がることで、主に
